# 훅 설치:
#   pre-commit install -t pre-commit -t pre-push
#
# 훅이 잘못 막을 때는 SKIP=<hook-id>로 잠깐 끌 수 있음:
#   SKIP=yamllint git commit
#
---
repos:
  # main에 직접 푸시하지 못하게 함. user/*, team/*, revert-*-user/* 브랜치만 허용.
  - repo: https://github.com/clumio-code/pre-push-hooks
    rev: v0.2
    hooks:
      - id: check-branch-for-push
        args: [
          '--pattern', '^user/.*',
          '--pattern', '^team/.*',
          '--pattern', '^revert-[0-9]+-user/.*'
        ]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=1048']
        stages: [pre-commit, manual]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # requirements-dev.txt의 ruff 버전과 맞춤.
    rev: v0.17.3
    hooks:
      - id: ruff
        stages: [pre-commit]
      - id: ruff-format
        stages: [pre-commit]

  - repo: https://github.com/adrienverge/yamllint.git
    # requirements-dev.txt의 yamllint 버전과 맞춤.
    rev: v1.38.0
    hooks:
      - id: yamllint
        stages: [pre-commit]
